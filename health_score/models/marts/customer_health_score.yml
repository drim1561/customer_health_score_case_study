version: 2

models:
  - name: customer_health_score
    description: >
      Final health score table. One row per account, materialized as a table
      in Snowflake for direct CSM querying. Composite score (0–100) is a
      weighted average of five components: submission trend, MAU trend,
      recency, product adoption, and relative peer activity.
    columns:
      - name: account_id
        description: Primary key — one row per account.
        tests:
          - unique
          - not_null

      - name: composite_health_score
        description: Weighted composite score from 0 (worst) to 100 (best).
        tests:
          - not_null

      - name: health_tier
        description: Categorical bucket derived from composite_health_score.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Healthy', 'At Risk', 'Critical']

      - name: renewal_urgency
        description: Combines health score with days_to_renewal to flag CSM priority.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Urgent', 'Watch', 'Monitor']

      - name: submission_trend_score
        description: Component 1 score (0–100). Weight 30%.
        tests:
          - not_null

      - name: mau_trend_score
        description: Component 2 score (0–100). Weight 25%.
        tests:
          - not_null

      - name: recency_score
        description: Component 3 score (0–100). Weight 20%.
        tests:
          - not_null

      - name: product_adoption_score
        description: Component 4 score (0–100). Weight 15%.
        tests:
          - not_null

      - name: relative_activity_score
        description: Component 5 score (0–100). Weight 10%. Peer benchmark.
        tests:
          - not_null

      - name: peer_percentile_rank
        description: >
          Rank (0–100) within division+segment peer group. 0 = bottom of peers.
          Use this to prioritize CSM outreach within the Healthy tier.
        tests:
          - not_null

      - name: retained_users
        description: Users active in both Q1 and Q2 2025.

      - name: new_users
        description: Users whose first-ever submission was in Q2 2025.

      - name: resurrected_users
        description: Users active in Q2 who were absent in Q1 but had pre-2025 history.

      - name: churned_users
        description: Users active in Q1 2025 who did not submit in Q2 2025.

      - name: user_churn_rate
        description: >
          Share of prior-period users who churned in Q2. Range 0–1.

      - name: new_user_rate
        description: >
          Share of Q2 MAU who are brand-new users. High rate with flat MAU
          can indicate churn being masked by new acquisition.

      - name: mau_benchmark_status
        description: >
          Traffic-light MAU classification. Green = ≥10% growth vs Q1.
          Yellow = stable (same or up, but under 1.1×). Red = user decline.
          New = no Q1 baseline.
        tests:
          - accepted_values:
              arguments:
                values: ['Green', 'Yellow', 'Red', 'New']

      - name: arr_tier
        description: Revenue size segment. Enterprise >$50K, Mid-Market $15K–$50K, SMB <$15K.
        tests:
          - accepted_values:
              arguments:
                values: ['Enterprise', 'Mid-Market', 'SMB']

      - name: arr_at_risk
        description: >
          Total ARR for this account if it falls into the Watch or Urgent renewal
          urgency tier; 0 otherwise. Used to quantify financial exposure. 
